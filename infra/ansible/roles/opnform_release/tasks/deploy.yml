---
- name: Require a digest-pinned release bundle
  ansible.builtin.assert:
    that:
      - opnform_release_id | length > 0
      - opnform_release_id is match('^sha-[0-9a-f]{40}$')
      - opnform_api_image is match('.*@sha256:[a-f0-9]{64}$')
      - opnform_client_image is match('.*@sha256:[a-f0-9]{64}$')
    fail_msg: A SHA-named release with digest-pinned API and client images is required.

- name: Check for an existing successful release
  ansible.builtin.stat:
    path: "{{ opnform_project_dir }}/current/docker-compose.yml"
  register: opnform_current_release_stat

- name: Set initial-deployment state
  ansible.builtin.set_fact:
    opnform_first_deploy: "{{ not opnform_current_release_stat.stat.exists }}"

- name: Deploy the release with rollback protection
  block:
    - name: Create a pre-release encrypted backup
      ansible.builtin.command:
        argv: [/usr/local/sbin/opnform-backup]
      register: opnform_release_backup
      changed_when: false
      no_log: true
      when: not opnform_first_deploy | bool

    - name: Pull immutable release images
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ opnform_release_dir }}/{{ opnform_release_id }}/docker-compose.yml"
          - pull
      changed_when: true

    # Upstream Nginx resolves backend hostnames at startup. Start application
    # containers first, recreate ingress, then wait for the full stack.
    - name: Start the immutable release without waiting on stale ingress
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ opnform_release_dir }}/{{ opnform_release_id }}/docker-compose.yml"
          - up
          - -d
          - --no-deps
          - --remove-orphans
          - api
          - api-worker
          - api-scheduler
          - ui
          - redis
          - db
      changed_when: true

    - name: Recreate ingress with the release Nginx configuration and aliases
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ opnform_release_dir }}/{{ opnform_release_id }}/docker-compose.yml"
          - up
          - -d
          - --no-deps
          - --force-recreate
          - --wait
          - --wait-timeout
          - '60'
          - ingress
      changed_when: true

    - name: Wait for the complete release stack to become healthy
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ opnform_release_dir }}/{{ opnform_release_id }}/docker-compose.yml"
          - up
          - -d
          - --wait
          - --wait-timeout
          - '300'
          - --remove-orphans
      changed_when: true

    - name: Check the Laravel version route through private ingress
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/api/v
        status_code: 200
        return_content: true
      register: opnform_version_response
      failed_when: >-
        opnform_version_response.status != 200 or
        'text/plain' not in (opnform_version_response.content_type | default('')) or
        (opnform_version_response.content | default('')).splitlines() | length != 2 or
        (opnform_version_response.content | default('')).splitlines()[-1] != opnform_release_id

    - name: Check Nuxt icon collections through private ingress
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/_nuxt_icon/{{ item.collection }}.json?icons={{ item.icon }}"
        status_code: 200
        return_content: true
      loop:
        - { collection: heroicons, icon: chevron-up-down-16-solid }
        - { collection: material-symbols, icon: check-box-outline-blank }
      register: opnform_icon_response
      failed_when: >-
        opnform_icon_response.status != 200 or
        opnform_icon_response.json.prefix | default('') != item.collection or
        opnform_icon_response.json.icons[item.icon].body | default('') | length == 0

    - name: Check the private health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/api/healthcheck
        status_code: 200
        return_content: false

    - name: Set the current release symlink only after successful startup
      ansible.builtin.file:
        src: "{{ opnform_release_dir }}/{{ opnform_release_id }}"
        dest: "{{ opnform_project_dir }}/current"
        state: link
        force: true

    - name: Leave maintenance mode after an existing-instance release
      ansible.builtin.include_tasks: maintenance.yml
      vars:
        opnform_maintenance_enabled: false
      when: not opnform_first_deploy | bool

    - name: Check the public version route through Caddy
      ansible.builtin.uri:
        url: "https://{{ opnform_hostname }}/v"
        status_code: 200
        return_content: true
        validate_certs: true
      register: opnform_public_version_response
      failed_when: >-
        opnform_public_version_response.status != 200 or
        'text/plain' not in (opnform_public_version_response.content_type | default('')) or
        (opnform_public_version_response.content | default('')).splitlines() | length != 2 or
        (opnform_public_version_response.content | default('')).splitlines()[-1] != opnform_release_id
      when: not opnform_first_deploy | bool

    - name: Check public Nuxt icon routes through Caddy
      ansible.builtin.uri:
        url: "https://{{ opnform_hostname }}/{{ item.path }}"
        status_code: 200
        return_content: true
        validate_certs: true
      loop:
        - { path: '_nuxt_icon/heroicons.json?icons=chevron-up-down-16-solid', collection: heroicons, icon: chevron-up-down-16-solid }
        - { path: '_nuxt_icon/material-symbols.json?icons=check-box-outline-blank', collection: material-symbols, icon: check-box-outline-blank }
        - { path: 'api/_nuxt_icon/heroicons.json?icons=chevron-up-down-16-solid', collection: heroicons, icon: chevron-up-down-16-solid }
      register: opnform_public_icon_response
      failed_when: >-
        opnform_public_icon_response.status != 200 or
        opnform_public_icon_response.json.prefix | default('') != item.collection or
        opnform_public_icon_response.json.icons[item.icon].body | default('') | length == 0
      when: not opnform_first_deploy | bool
  rescue:
    - name: Install the maintenance overlay before restoring the previous release
      ansible.builtin.include_tasks: maintenance_overlay.yml
      when: not opnform_first_deploy | bool

    # Public checks run after `current` moves. Recover through the release
    # captured in prepare, not the candidate symlink.
    - name: Point current back at the captured previous release
      ansible.builtin.file:
        src: "{{ opnform_release_dir }}/{{ opnform_prepare_current_release }}"
        dest: "{{ opnform_project_dir }}/current"
        state: link
        force: true
      when:
        - not opnform_first_deploy | bool
        - opnform_prepare_current_release is defined
        - opnform_prepare_current_release | length > 0

    - name: Restore the previous release containers
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ opnform_release_dir }}/{{ opnform_prepare_current_release }}/docker-compose.yml"
          - up
          - -d
          - --no-deps
          - --remove-orphans
          - api
          - api-worker
          - api-scheduler
          - ui
          - redis
          - db
      changed_when: true
      when:
        - not opnform_first_deploy | bool
        - opnform_prepare_current_release is defined
        - opnform_prepare_current_release | length > 0

    - name: Recreate ingress for the previous release
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ opnform_release_dir }}/{{ opnform_prepare_current_release }}/docker-compose.yml"
          - up
          - -d
          - --no-deps
          - --force-recreate
          - --wait
          - --wait-timeout
          - '60'
          - ingress
      changed_when: true
      when:
        - not opnform_first_deploy | bool
        - opnform_prepare_current_release is defined
        - opnform_prepare_current_release | length > 0

    - name: Wait for the restored release stack
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ opnform_release_dir }}/{{ opnform_prepare_current_release }}/docker-compose.yml"
          - up
          - -d
          - --wait
          - --wait-timeout
          - '300'
      changed_when: true
      when:
        - not opnform_first_deploy | bool
        - opnform_prepare_current_release is defined
        - opnform_prepare_current_release | length > 0

    - name: Check for a Caddy site in the recovery snapshot
      ansible.builtin.stat:
        path: "{{ opnform_recovery_snapshot }}/opnform.caddy"
      register: opnform_recovery_caddy_site
      when:
        - not opnform_first_deploy | bool
        - opnform_recovery_snapshot is defined

    - name: Restore the previous release Caddy site from the recovery snapshot
      ansible.builtin.copy:
        src: "{{ opnform_recovery_snapshot }}/opnform.caddy"
        dest: "{{ opnform_caddy_snippet_dir }}/opnform.caddy"
        remote_src: true
        owner: root
        group: root
        mode: '0644'
      when:
        - not opnform_first_deploy | bool
        - opnform_recovery_snapshot is defined
        - opnform_recovery_caddy_site.stat.exists | default(false)

    - name: Check for a Cloudflare gate in the recovery snapshot
      ansible.builtin.stat:
        path: "{{ opnform_recovery_snapshot }}/opnform-cloudflare-gate.caddy"
      register: opnform_recovery_gate
      when:
        - not opnform_first_deploy | bool
        - opnform_recovery_snapshot is defined

    - name: Restore the previous Cloudflare gate from the recovery snapshot
      ansible.builtin.copy:
        src: "{{ opnform_recovery_snapshot }}/opnform-cloudflare-gate.caddy"
        dest: "{{ opnform_cloudflare_gate_snippet }}"
        remote_src: true
        owner: root
        group: root
        mode: '0644'
      when:
        - not opnform_first_deploy | bool
        - opnform_recovery_snapshot is defined
        - opnform_recovery_gate.stat.exists | default(false)

    - name: Read the recovered Compose bundle
      ansible.builtin.slurp:
        src: "{{ opnform_recovery_snapshot }}/docker-compose.yml"
      register: opnform_recovery_compose_slurp
      when:
        - not opnform_first_deploy | bool
        - opnform_recovery_snapshot is defined

    - name: Check for Nginx in the recovery snapshot
      ansible.builtin.stat:
        path: "{{ opnform_recovery_snapshot }}/nginx.conf"
      register: opnform_recovery_nginx
      when:
        - not opnform_first_deploy | bool
        - opnform_recovery_snapshot is defined

    - name: Restore the shared Nginx path when the previous release mounted it
      ansible.builtin.copy:
        src: "{{ opnform_recovery_snapshot }}/nginx.conf"
        dest: "{{ opnform_project_dir }}/config/nginx.conf"
        remote_src: true
        owner: root
        group: root
        mode: '0644'
      when:
        - not opnform_first_deploy | bool
        - opnform_recovery_snapshot is defined
        - opnform_recovery_nginx.stat.exists | default(false)
        - opnform_recovery_compose_slurp is defined
        - (opnform_project_dir ~ '/config/nginx.conf') in (opnform_recovery_compose_slurp.content | default('') | b64decode)

    - name: Restore the pre-release database and uploads snapshot
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/opnform-restore-snapshot
          - "{{ opnform_release_backup.stdout | trim }}"
      changed_when: true
      no_log: true
      when:
        - not opnform_first_deploy | bool
        - opnform_release_backup is defined
        - not (opnform_release_backup.failed | default(true) | bool)
        - opnform_release_backup.stdout | default('') | trim | length > 0

    - name: Leave the maintenance overlay in place after a failed release
      ansible.builtin.debug:
        msg: >-
          Release failed. Previous containers and routing were restored when
          available. Maintenance remains enabled until an operator reopens
          traffic after verifying recovery.

    - name: Stop after failed release rollback
      ansible.builtin.fail:
        msg: Release failed. The previous release and its pre-release backup were restored when available. Maintenance remains enabled.
