---
- name: Install Caddy repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
    state: present
    update_cache: true

- name: Download Caddy repository signing key
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /usr/share/keyrings/caddy-stable-archive-keyring.asc
    owner: root
    group: root
    mode: '0644'

- name: Configure the Caddy stable APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.asc] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main"
    filename: caddy-stable
    state: present

- name: Install Caddy v2
  ansible.builtin.apt:
    name: "{{ 'caddy=' ~ opnform_caddy_package_version if opnform_caddy_package_version | length > 0 else 'caddy' }}"
    state: present
    update_cache: true

- name: Enable the Caddy service
  ansible.builtin.service:
    name: "{{ opnform_caddy_service_name }}"
    enabled: true
    state: started
