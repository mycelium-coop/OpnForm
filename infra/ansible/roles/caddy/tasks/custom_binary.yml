---
- name: Require a Cloudflare DNS API token for ACME DNS-01
  ansible.builtin.assert:
    that:
      - opnform_caddy_dns_api_token | length > 0
    fail_msg: >-
      CLOUDFLARE_DNS_API_TOKEN is required for host Caddy DNS-01 (Zone:Read +
      DNS:Edit). Add cloudflare-dns-api-token to tech-admin/opnform-secrets and
      re-run `just env`.

- name: Checksum the installed custom Caddy binary
  ansible.builtin.stat:
    path: "{{ opnform_caddy_custom_binary }}"
    checksum_algorithm: sha256
  register: opnform_caddy_installed_binary

- name: Record whether the pinned Caddy binary is already installed
  ansible.builtin.set_fact:
    opnform_caddy_binary_current: >-
      {{
        (opnform_caddy_installed_binary.stat.exists | bool)
        and (
          (opnform_caddy_installed_binary.stat.checksum | default(''))
          == opnform_caddy_custom_checksums[opnform_caddy_binary_arch]
        )
      }}

- name: Checksum the staged Caddy artifact
  when: not opnform_caddy_binary_current | bool
  ansible.builtin.stat:
    path: "{{ opnform_caddy_incoming_binary }}"
    checksum_algorithm: sha256
  register: opnform_caddy_staged_binary

- name: Require the staged Caddy artifact before installation
  when: not opnform_caddy_binary_current | bool
  ansible.builtin.assert:
    that:
      - opnform_caddy_staged_binary.stat.exists | bool
      - >-
        (opnform_caddy_staged_binary.stat.checksum | default(''))
        == opnform_caddy_custom_checksums[opnform_caddy_binary_arch]
    fail_msg: >-
      The pinned Caddy artifact is not staged at {{ opnform_caddy_incoming_binary }}.
      Fetch and verify it before enabling maintenance.

- name: Install the staged Caddy binary
  when: not opnform_caddy_binary_current | bool
  ansible.builtin.command:
    argv:
      - install
      - -m
      - '0755'
      - -o
      - root
      - -g
      - root
      - "{{ opnform_caddy_incoming_binary }}"
      - "{{ opnform_caddy_custom_binary }}"
  changed_when: true

- name: Verify the custom Caddy binary reports the pinned version
  ansible.builtin.command:
    argv:
      - "{{ opnform_caddy_custom_binary }}"
      - version
  register: opnform_caddy_custom_version_check
  changed_when: false
  failed_when: >-
    opnform_caddy_custom_version_check.rc != 0
    or (opnform_caddy_custom_version_check.stdout.split() | first)
    != opnform_caddy_custom_version

- name: Verify the Cloudflare DNS module is present
  ansible.builtin.command:
    argv:
      - "{{ opnform_caddy_custom_binary }}"
      - list-modules
  register: opnform_caddy_modules
  changed_when: false
  failed_when: "'dns.providers.cloudflare' not in opnform_caddy_modules.stdout"

- name: Create the Caddy systemd drop-in directory
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ opnform_caddy_service_name }}.service.d"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the OpnForm Caddy systemd drop-in
  ansible.builtin.template:
    src: caddy-opnform.service.d.j2
    dest: "/etc/systemd/system/{{ opnform_caddy_service_name }}.service.d/opnform.conf"
    owner: root
    group: root
    mode: '0644'
  notify: Caddy | Reload systemd

- name: Render the Caddy DNS environment file
  ansible.builtin.template:
    src: opnform.env.j2
    dest: "{{ opnform_caddy_env_file }}"
    owner: root
    group: caddy
    mode: '0640'
  no_log: true
  diff: false
  notify: Caddy | Reload systemd

- name: Flush Caddy handlers before using the custom binary
  ansible.builtin.meta: flush_handlers

- name: Restart Caddy on the custom binary
  ansible.builtin.systemd:
    name: "{{ opnform_caddy_service_name }}"
    state: restarted
    daemon_reload: true
    enabled: true
