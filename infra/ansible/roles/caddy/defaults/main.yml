---
opnform_caddy_service_name: caddy
opnform_caddy_config_path: /etc/caddy/Caddyfile
opnform_caddy_snippet_dir: /etc/caddy/conf.d
opnform_caddy_package_version: ''
opnform_caddy_email: ''
opnform_cloudflare_proxied: true
opnform_caddy_origin_lockdown: true
opnform_hostname: ''
opnform_maintenance_file: /etc/caddy/opnform-maintenance.caddy
opnform_caddy_dns_api_token: "{{ lookup('ansible.builtin.env', 'CLOUDFLARE_DNS_API_TOKEN', default='') }}"
opnform_project_dir: /opt/opnform
# Bytes are in the R2 backup bucket at caddy/<version>/linux-<arch>/<sha256>.
# caddyserver.com/api/download ignores version= and replaces cached builds.
opnform_caddy_custom_version: 'v2.11.4'
opnform_caddy_cloudflare_plugin_version: 'v0.2.4'
opnform_caddy_platform_arches:
  linux/amd64: amd64
  linux/arm64: arm64
opnform_caddy_image_platform: "{{ lookup('ansible.builtin.env', 'IMAGE_PLATFORM', default='linux/amd64') | trim }}"
opnform_caddy_binary_arch: >-
  {{
    opnform_caddy_platform_arches[opnform_caddy_image_platform]
    if opnform_caddy_image_platform in opnform_caddy_platform_arches
    else ''
  }}
opnform_caddy_custom_checksums:
  amd64: 02d058c1bcd1d85700b953666dad2a28a99bc03224549ab952ef062a419ab8e4
opnform_caddy_custom_binary: /usr/local/bin/caddy-opnform
opnform_caddy_incoming_binary: "{{ opnform_project_dir }}/incoming/caddy-linux-{{ opnform_caddy_binary_arch }}"
opnform_caddy_env_file: /etc/caddy/opnform.env
opnform_cloudflare_gate_snippet: /var/lib/opnform-cloudflare-origin-firewall/caddy/opnform-cloudflare-gate.caddy
