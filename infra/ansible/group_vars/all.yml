---
# Static playbook defaults. Values written by `just inventory` live in
# inventories/production/group_vars/all/generated.yml and must not be
# duplicated here — playbook group_vars win over inventory group_vars.
opnform_project_dir: /opt/opnform
opnform_project_name: opnform
opnform_release_dir: /opt/opnform/releases
opnform_backup_dir: /opt/opnform/backups
opnform_restore_dir: /var/lib/opnform-restore
opnform_compose_file: /opt/opnform/current/docker-compose.yml
opnform_maintenance_file: /etc/caddy/opnform-maintenance.caddy
opnform_release_id: "{{ lookup('ansible.builtin.env', 'RELEASE_ID', default='') }}"
opnform_api_image: "{{ lookup('ansible.builtin.env', 'OPNFORM_API_IMAGE', default='') }}"
opnform_client_image: "{{ lookup('ansible.builtin.env', 'OPNFORM_CLIENT_IMAGE', default='') }}"
opnform_postgres_image: "{{ lookup('ansible.builtin.env', 'OPNFORM_POSTGRES_IMAGE', default='') }}"
opnform_redis_image: "{{ lookup('ansible.builtin.env', 'OPNFORM_REDIS_IMAGE', default='') }}"
opnform_nginx_image: "{{ lookup('ansible.builtin.env', 'OPNFORM_NGINX_IMAGE', default='') }}"
opnform_rollback_release: ''
